<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Doorsturen…</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; color: #222; background: #fafafa; text-align: center; }
    a { color: #0b5cad; }
  </style>
</head>
<body>
  <p id="msg">Je wordt doorgestuurd…</p>
  <noscript><p>JavaScript is nodig om door te sturen.</p></noscript>
  <script>
    (function () {
      var msg = document.getElementById('msg');
      // Ondersteunt zowel r/?menu als r/?c=menu
      var params = new URLSearchParams(location.search);
      var code = params.get('c') || location.search.slice(1).split('&')[0];
      code = decodeURIComponent(code || '').trim().toLowerCase();

      if (!code) { msg.textContent = 'Geen QR-code opgegeven.'; return; }

      // Cache-busting zodat een gewijzigde bestemming direct werkt
      fetch('../links.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
        .then(function (links) {
          var dest = links[code];
          if (dest && typeof dest === 'object') dest = dest.url;
          if (!dest || !/^https?:\/\//i.test(dest)) {
            msg.textContent = 'Onbekende of ongeldige QR-code: "' + code + '".';
            return;
          }
          msg.innerHTML = 'Je wordt doorgestuurd naar <a></a>…';
          msg.querySelector('a').href = dest;
          msg.querySelector('a').textContent = dest;
          location.replace(dest);
        })
        .catch(function () { msg.textContent = 'Kon de links niet laden. Probeer het later opnieuw.'; });
    })();
  </script>
</body>
</html>
