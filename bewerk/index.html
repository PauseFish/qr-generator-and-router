<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR-code bewerken</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<main>
  <p style="margin:0 0 8px"><a id="back">← Alle QR-codes</a></p>
  <h1 id="title">QR-code bewerken</h1>
  <p class="lead mono" id="sub"></p>
  <div id="content"><div class="card empty">Laden…</div></div>
</main>
<script src="../vendor/qrcode.js"></script>
<script src="../assets/app.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); }, el = App.el;
  var params = new URLSearchParams(location.search), code = App.cleanCode(params.get('c'));
  App.chrome('bewerk');
  $('back').href = App.url('overzicht');

  function notFound() {
    $('title').textContent = 'QR-code niet gevonden';
    $('content').innerHTML = '';
    $('content').appendChild(el('div', { class: 'card empty' }, ['Er bestaat geen QR-code met code "' + code + '". ', el('a', { href: App.url('overzicht'), text: 'Terug naar het overzicht' })]));
  }

  function render(item) {
    var fixed = App.fixedUrl(code);
    $('title').textContent = item.label || code;
    $('sub').textContent = 'Code: ' + code;
    document.title = (item.label || code) + ' – QR bewerken';

    var labelIn = el('input', { id: 'label', value: item.label, placeholder: 'Naam', autocomplete: 'off' });
    var urlIn = el('input', { id: 'url', type: 'url', value: item.url, placeholder: 'https://…' });
    var save = el('button', { type: 'submit', text: 'Wijzigingen opslaan', disabled: '' });
    var dirty = function () { save.disabled = urlIn.value.trim() === item.url && labelIn.value.trim() === item.label; };
    labelIn.addEventListener('input', dirty); urlIn.addEventListener('input', dirty);

    var form = el('form', { class: 'card', novalidate: '' }, [
      el('div', { class: 'field' }, [el('label', { for: 'label', text: 'Naam' }), labelIn]),
      el('div', { class: 'field' }, [el('label', { for: 'url', text: 'Bestemming' }), urlIn,
        el('p', { class: 'hint', text: 'Hier stuurt de QR-code naartoe. Wijzigingen zijn binnen ±1 minuut live.' })]),
      el('div', { class: 'field' }, [el('label', { text: 'Vaste URL in de QR-code (verandert nooit)' }), el('input', { value: fixed, readonly: '' })]),
      el('div', { class: 'actions' }, [
        save,
        el('button', { type: 'button', class: 'danger', text: 'Verwijderen', on: { click: remove } })
      ])
    ]);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var u = urlIn.value.trim(), l = labelIn.value.trim();
      if (!App.validUrl(u)) return App.toast('Ongeldige URL (moet met http:// of https:// beginnen).', true);
      App.busy(save, true, 'Opslaan…');
      App.commit('Update QR "' + code + '" → ' + u, function (d) {
        if (!d[code]) throw new Error('Deze QR-code bestaat niet meer.');
        d[code] = { url: u, label: l };
      }).then(function (d) { App.toast('Opgeslagen. Live binnen ±1 minuut.'); render(d[code]); })
        .catch(function (e) { App.busy(save, false); App.toast(e.message, true); });
    });

    var panel = el('div', { class: 'card qr-panel' }, [
      el('div', { class: 'qr-box' }, [App.qrCanvas(fixed, 220)]),
      el('div', { class: 'actions' }, [
        el('button', { text: 'PNG', on: { click: function () { App.downloadPng(code); } } }),
        el('button', { class: 'ghost', text: 'SVG', on: { click: function () { App.downloadSvg(code); } } })
      ]),
      el('div', { class: 'actions' }, [
        el('button', { class: 'ghost', text: 'Kopieer URL', on: { click: function () { navigator.clipboard.writeText(fixed).then(function () { App.toast('URL gekopieerd.'); }); } } }),
        el('a', { class: 'btn ghost', href: fixed, target: '_blank', rel: 'noopener', text: 'Test' })
      ])
    ]);

    $('content').innerHTML = '';
    $('content').appendChild(el('div', { class: 'split' }, [form, panel]));
  }

  function remove() {
    if (!confirm('QR-code "' + code + '" verwijderen?\n\nGeprinte exemplaren werken daarna niet meer.')) return;
    App.commit('Delete QR "' + code + '"', function (d) { delete d[code]; })
      .then(function () { location.href = App.url('overzicht'); })
      .catch(function (e) { App.toast(e.message, true); });
  }

  if (!code) notFound();
  else App.load().then(function (d) {
    if (!d[code]) return notFound();
    render(d[code]);
    if (params.get('nieuw')) {
      App.toast('QR-code aangemaakt. Live binnen ±1 minuut.');
      history.replaceState(null, '', App.url('bewerk/', { c: code }));
    }
  }).catch(function (e) { App.toast(e.message, true); notFound(); });
</script>
</body>
</html>
