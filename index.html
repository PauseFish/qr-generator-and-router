<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Alle QR-codes</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
  <h1>Alle QR-codes</h1>
  <p class="lead">Elke QR-code heeft een vaste URL. Klik op <strong>Bewerken</strong> om de bestemming te wijzigen.</p>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Zoeken op naam, code of bestemming…">
    <span class="muted" id="count"></span>
    <span class="spacer" style="flex:1"></span>
    <a class="btn" id="newBtn">+ Nieuwe QR-code</a>
  </div>
  <div id="list"><div class="card empty">Laden…</div></div>
</main>
<script src="vendor/qrcode.js"></script>
<script src="assets/app.js"></script>
<script>
  var el = App.el, links = {};
  App.chrome('overzicht');
  document.getElementById('newBtn').href = App.url('nieuw');

  function render() {
    var list = document.getElementById('list'), q = document.getElementById('search').value.trim().toLowerCase();
    var codes = Object.keys(links);
    var shown = codes.filter(function (k) { return !q || (k + ' ' + links[k].label + ' ' + links[k].url).toLowerCase().indexOf(q) !== -1; });
    document.getElementById('count').textContent = codes.length + (codes.length === 1 ? ' QR-code' : ' QR-codes');
    list.innerHTML = '';
    if (!codes.length) {
      list.appendChild(el('div', { class: 'card empty' }, ['Nog geen QR-codes. ', el('a', { href: App.url('nieuw'), text: 'Maak je eerste QR-code aan' }), '.']));
      return;
    }
    if (!shown.length) { list.appendChild(el('div', { class: 'card empty', text: 'Geen resultaten.' })); return; }
    var grid = el('div', { class: 'grid' });
    shown.forEach(function (code) {
      var item = links[code], editUrl = App.url('bewerk/', { c: code });
      grid.appendChild(el('div', { class: 'card tile' }, [
        el('div', { class: 'tile-head' }, [
          el('a', { class: 'qr-box', href: editUrl, title: 'Bewerken' }, [App.qrCanvas(App.fixedUrl(code), 76)]),
          el('div', {}, [el('h3', { text: item.label || code }), el('span', { class: 'mono muted', text: code })])
        ]),
        el('div', { class: 'dest', title: item.url }, ['→ ', el('a', { href: item.url, target: '_blank', rel: 'noopener', text: item.url })]),
        el('div', { class: 'actions' }, [
          el('a', { class: 'btn', href: editUrl, text: 'Bewerken' }),
          el('button', { class: 'ghost', text: 'PNG', on: { click: function () { App.downloadPng(code); } } }),
          el('button', { class: 'ghost', text: 'SVG', on: { click: function () { App.downloadSvg(code); } } })
        ])
      ]));
    });
    list.appendChild(grid);
  }

  document.getElementById('search').addEventListener('input', render);
  App.load().then(function (d) { links = d; render(); })
    .catch(function (e) { App.toast(e.message, true); links = {}; render(); });
</script>
</body>
</html>
